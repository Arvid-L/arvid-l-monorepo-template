<mat-toolbar class="app-toolbar">
  <a class="app-title" [routerLink]="['/']">{{ 'nav.title' | transloco }}</a>
  <span class="toolbar-spacer"></span>
  <button
    mat-button
    type="button"
    class="lang-toggle"
    (click)="language.toggle()"
  >
    {{ language.active() === 'en' ? 'DE' : 'EN' }}
  </button>
  @if (auth.isLoggedIn()) {
    <span class="user-email">{{ auth.currentUser()?.email }}</span>
    <button mat-button (click)="auth.logout()">
      {{ 'nav.logout' | transloco }}
    </button>
  } @else {
    <a mat-button [routerLink]="['/', ROUTES.LOGIN]">{{
      'nav.login' | transloco
    }}</a>
  }
</mat-toolbar>

<router-outlet></router-outlet>

<footer class="app-footer">
  <a [routerLink]="['/', ROUTES.IMPRINT]">{{ 'footer.imprint' | transloco }}</a>
  <a [routerLink]="['/', ROUTES.PRIVACY]">{{ 'footer.privacy' | transloco }}</a>
</footer>

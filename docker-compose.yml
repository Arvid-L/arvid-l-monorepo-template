version: '3.8'

services:
  # Dev DB
  postgres:
    image: postgres:16-alpine
    container_name: arvid-l-monorepo-template-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: arvid-l-monorepo-template-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # E2E Test DB
  postgres-test:
    image: postgres:16-alpine
    container_name: arvid-l-monorepo-template-db-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: arvid-l-monorepo-template-db-test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  postgres_test_data:
    driver: local
